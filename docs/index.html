<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF 爬蟲數據查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section h2 {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }
        
        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.1);
        }
        
        .status-card h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .status-card .value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }
        
        .status-card .label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        table thead {
            background: #f0f0f0;
        }
        
        table th {
            padding: 12px;
            text-align: left;
            color: #333;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
        }
        
        table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        table tbody tr:hover {
            background: #f9f9f9;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-item .number {
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-item .label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .footer {
            background: #f0f0f0;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s;
            margin-right: 10px;
        }
        
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 ETF 爬蟲數據查看器</h1>
            <p>實時展示台灣 ETF 基金數據</p>
        </header>
        
        <div class="content">
            <!-- 狀態信息 -->
            <div class="section">
                <h2>📈 數據總覽</h2>
                <div id="status" class="loading">
                    <p>加載中...</p>
                </div>
            </div>
            
            <!-- ETF 摘要 -->
            <div class="section">
                <h2>💼 活躍 ETF 基金</h2>
                <div id="etf-summary" class="loading">
                    <p>加載中...</p>
                </div>
            </div>
            
            <!-- 股票變動 -->
            <div class="section">
                <h2>📑 最新報告</h2>
                <div id="reports" class="loading">
                    <p>加載中...</p>
                </div>
            </div>
            
            <!-- 使用說明 -->
            <div class="section">
                <h2>ℹ️ 使用說明</h2>
                <div class="status-card">
                    <h3>數據更新</h3>
                    <p style="color: #666; line-height: 1.6;">
                        此網站展示 ETF 爬蟲自動收集的最新數據。<br><br>
                        <strong>更新時間：</strong>每晚 9:00 PM（台灣時間）<br>
                        <strong>數據來源：</strong>台灣各大基金公司官網<br>
                        <strong>數據格式：</strong>JSON 格式存儲<br><br>
                        <button class="btn" onclick="refreshData()">🔄 重新加載</button>
                    </p>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>🚀 ETF 爬蟲系統 | 由 GitHub Actions 每日自動更新</p>
            <p style="font-size: 0.9em; margin-top: 10px;">最後更新：<span id="last-update">加載中...</span></p>
        </div>
    </div>
    
    <script>
        // 加載 JSON 數據
        async function loadData() {
            try {
                // 嘗試加載 ETF 摘要
                const response = await fetch('./data/active_etf_summary.json');
                if (response.ok) {
                    const data = await response.json();
                    displayEtfData(data);
                } else {
                    showStatus('數據暫未準備就緒，請稍後再試');
                }
            } catch (error) {
                showStatus('無法加載數據，請確保數據文件已上傳到 GitHub');
            }
        }
        
        function displayEtfData(data) {
            const statusDiv = document.getElementById('status');
            const summaryDiv = document.getElementById('etf-summary');
            
            // 計算統計信息
            const totalFunds = Object.keys(data).length;
            let totalValue = 0;
            let fundDetails = [];
            
            for (const [fundCode, fundInfo] of Object.entries(data)) {
                if (fundInfo.price) {
                    totalValue += parseFloat(fundInfo.price) || 0;
                }
                fundDetails.push({
                    code: fundCode,
                    name: fundInfo.name || '未知',
                    price: fundInfo.price || 'N/A',
                    change: fundInfo.change || 'N/A',
                    company: fundInfo.company || '未知'
                });
            }
            
            // 顯示統計卡片
            statusDiv.innerHTML = `
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="number">${totalFunds}</div>
                        <div class="label">監控基金數</div>
                    </div>
                    <div class="stat-item">
                        <div class="number">${new Date().toLocaleDateString('zh-TW')}</div>
                        <div class="label">數據日期</div>
                    </div>
                </div>
            `;
            
            // 顯示 ETF 表格
            let tableHTML = '<table><thead><tr><th>基金代碼</th><th>基金名稱</th><th>發行公司</th><th>淨值</th><th>漲跌</th></tr></thead><tbody>';
            
            fundDetails.slice(0, 10).forEach(fund => {
                tableHTML += `
                    <tr>
                        <td><strong>${fund.code}</strong></td>
                        <td>${fund.name}</td>
                        <td>${fund.company}</td>
                        <td>${fund.price}</td>
                        <td>${fund.change}</td>
                    </tr>
                `;
            });
            
            tableHTML += '</tbody></table>';
            summaryDiv.innerHTML = tableHTML;
            
            // 更新時間
            document.getElementById('last-update').textContent = new Date().toLocaleString('zh-TW');
        }
        
        function showStatus(message) {
            document.getElementById('status').innerHTML = `<div class="error">${message}</div>`;
            document.getElementById('etf-summary').innerHTML = `<div class="error">${message}</div>`;
        }
        
        function refreshData() {
            location.reload();
        }
        
        // 頁面加載完成後執行
        window.addEventListener('load', () => {
            loadData();
        });
    </script>
</body>
</html>
