name: Daily Crawler ETF

on:
  schedule:
    # 每天晚上 9 點 (台灣時間) = UTC 13:00
    - cron: '0 13 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  run_crawler:
    runs-on: windows-latest
    
    steps:
      - name: 檢查代碼
        uses: actions/checkout@v3
      
      - name: 設置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show selenium
          python -m pip show beautifulsoup4
      
      - name: 運行爬蟲
        run: python Crawler_ETF.py
      
      - name: 生成 GitHub Pages 網站資料
        run: |
          python - <<'PY'
          import json
          import os

          all_stocks_path = os.path.join('etf', 'all_stocks.json')
          output_path = os.path.join('docs', 'data', 'active_etf_summary.json')

          if not os.path.exists(all_stocks_path):
              raise SystemExit(f'找不到 {all_stocks_path}')

          with open(all_stocks_path, 'r', encoding='utf-8') as f:
              payload = json.load(f)

          etfs = payload.get('etfs', {})
          output = []
          for code, info in etfs.items():
              output.append({
                  'code': code,
                  'name': info.get('name', ''),
                  'company': info.get('company', '未知') if isinstance(info, dict) else '未知',
                  'price': info.get('price', 'N/A') if isinstance(info, dict) else 'N/A',
                  'change': info.get('change', 'N/A') if isinstance(info, dict) else 'N/A'
              })

          os.makedirs(os.path.dirname(output_path), exist_ok=True)
          with open(output_path, 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          PY
      
      - name: 提交更新到 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "自動爬蟲更新 - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" || echo "沒有更改要提交"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        shell: powershell
