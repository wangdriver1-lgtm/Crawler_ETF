name: Daily Crawler ETF

on:
  push:
    branches: [main]
  schedule:
    # 每天晚上 9 點 (台灣時間) = UTC 13:00
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      recover_only:
        description: '只重試缺漏來源，沿用已成功的持股快照'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: etf-update-and-pages
  cancel-in-progress: false

jobs:
  run_crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload_site.outputs.artifact_id }}
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      needs_retry: ${{ steps.health.outputs.needs_retry }}
      failed_codes: ${{ steps.health.outputs.failed_codes }}
      crawl_failed: ${{ steps.crawl.outcome == 'failure' }}
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: '1'
    
    steps:
      - name: 檢查代碼
        uses: actions/checkout@v4
      
      - name: 設置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip show selenium
          python -m pip show beautifulsoup4
      
      - name: 離線回歸測試
        run: python -m unittest discover -s tests

      - name: 自動發現已上市主動式 ETF
        if: github.event_name != 'push'
        run: python etf_registry.py

      - name: 運行爬蟲
        id: crawl
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          CRAWLER_ALLOW_PARTIAL: '1'
          CRAWLER_RETRIES: '1'
          CRAWLER_USE_BACKUP: '1'
          CRAWLER_RECOVER_ONLY: ${{ inputs.recover_only && '1' || '0' }}
          # GitHub may start Friday's scheduled run after midnight. Still fetch
          # the latest source snapshots; identical holdings never create trades.
          CRAWLER_FORCE_FETCH: '1'
        run: python Crawler_ETF.py

      - name: 檢查全部 ETF 更新結果
        id: health
        if: github.event_name != 'push'
        run: python ci_health.py --outputs

      - name: 保存執行紀錄
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: crawler-diagnostics-${{ github.run_id }}
          path: |
            logs/
            debug_page_*.html
          retention-days: 7
          if-no-files-found: ignore
      
      - name: 生成 GitHub Pages 網站資料
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          all_stocks_path = os.path.join('etf', 'all_stocks.json')
          output_path = os.path.join('docs', 'data', 'active_etf_summary.json')

          if not os.path.exists(all_stocks_path):
              raise SystemExit(f'找不到 {all_stocks_path}')

          with open(all_stocks_path, 'r', encoding='utf-8') as f:
              payload = json.load(f)

          etfs = payload.get('etfs', {})
          output = {}
          for code, info in etfs.items():
              if not isinstance(info, dict):
                  continue
              output[code] = {
                  'name': info.get('name', ''),
                  'company': info.get('company', '未知'),
                  'price': info.get('price', 'N/A'),
                  'change': info.get('change', 'N/A'),
                  'date': info.get('date', payload.get('date')),
                  'status': info.get('status', 'fresh'),
                  'source_kind': info.get('source_kind'),
                  'source_name': info.get('source_name'),
                  'source_url': info.get('source_url'),
              }

          os.makedirs(os.path.dirname(output_path), exist_ok=True)
          with open(output_path, 'w', encoding='utf-8') as f:
              json.dump({
                  'date': payload.get('date'),
                  'updated_at': payload.get('updated_at'),
                  'missing_share_etfs': payload.get('missing_share_etfs', []),
                  'failed_etfs': payload.get('failed_etfs', []),
                  'etfs': output,
              }, f, ensure_ascii=False, indent=2)
          PY
      
      - name: 匯出 ETF 詳細資料
        run: python etf_details.py --export docs/data/etf_details --market

      - name: 提交更新到 GitHub
        if: github.event_name != 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add etf/ stocks/ stock_shares/*.json docs/data/
          if git diff --cached --quiet; then
            echo "沒有更改要提交"
          else
            git commit -m "自動爬蟲更新 - $(date -u +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳網站
        id: upload_site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: run_crawler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 確認網站發佈檔案已可讀取
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ needs.run_crawler.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.run_crawler.outputs.artifact_name }}
        with:
          script: |
            const id = Number(process.env.ARTIFACT_ID);
            if (!Number.isSafeInteger(id) || id <= 0) throw new Error('Missing uploaded artifact ID');
            for (let attempt = 0; attempt < 8; attempt++) {
              try {
                const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                  ...context.repo, run_id: context.runId, per_page: 100
                });
                const match = data.artifacts.find(a => a.id === id && a.name === process.env.ARTIFACT_NAME && !a.expired);
                if (match) return core.info(`Pages artifact ready: ${match.id}`);
              } catch (error) {
                if (![404, 429, 500, 502, 503, 504].includes(error.status)) throw error;
              }
              await new Promise(resolve => setTimeout(resolve, Math.min(5000 * 2 ** attempt, 30000)));
            }
            throw new Error('Pages artifact was uploaded but is not yet visible; recovery workflow will retry after 30 minutes.');
      - name: 發佈網站
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ needs.run_crawler.outputs.artifact_name }}

  verify:
    needs: [run_crawler, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 確認資料與部署皆完成
        env:
          BUILD_RESULT: ${{ needs.run_crawler.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DATA_RETRY: ${{ needs.run_crawler.outputs.needs_retry }}
          CRAWL_FAILED: ${{ needs.run_crawler.outputs.crawl_failed }}
          FAILED_CODES: ${{ needs.run_crawler.outputs.failed_codes }}
        run: |
          if [ "$BUILD_RESULT" != success ] || [ "$DEPLOY_RESULT" != success ]; then
            echo '建置或網站發佈失敗，將交由半小時重試流程處理。'
            exit 1
          fi
          if [ "$DATA_RETRY" = true ] || [ "$CRAWL_FAILED" = true ]; then
            echo "待補抓的 ETF：$FAILED_CODES；已發佈成功部分，半小時後自動補抓。"
            exit 1
          fi
          echo '全部 ETF 都有有效持股，網站部署成功。'
